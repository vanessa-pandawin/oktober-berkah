        /* ============================================
           BACKGROUND BUBBLE ANIMATION
        ============================================ */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .buble {
            position: relative;
            display: flex;
            justify-content: space-evenly;
            width: 100%;
            height: 100%;
        }

        .buble span {
            width: 30px;
            height: 30px;
            background: #ff2e78;
            border-radius: 50%;
            box-shadow: 0 0 10px #00c3ff46, 0 0 50px #ff2e78, 0 0 100px #ff2e78;
            animation: bubleanim 15s linear infinite alternate;
            animation-duration: calc(90s / var(--i, 10));
        }

        @keyframes bubleanim {
            0%   { transform: translateY(100vh) scale(0); }
            100% { transform: translateY(-10vh) scale(1); }
        }

        /* ============================================
           ANIMASI FADE / HEARTBEAT
        ============================================ */
        .animated { animation-duration: 1s; animation-fill-mode: both; }
        .animated.infinite { animation-iteration-count: infinite; }
        .animated.slow { animation-duration: 2s; }
        .animated.slower { animation-duration: 3s; }

        @keyframes heartBeat {
            0%   { transform: scale(1); }
            14%  { transform: scale(1.3); }
            28%  { transform: scale(1); }
            42%  { transform: scale(1.3); }
            70%  { transform: scale(1); }
        }
        .heartBeat {
            animation-name: heartBeat;
            animation-duration: 1.3s;
            animation-timing-function: ease-in-out;
        }

        @keyframes fadeIn { 0% { opacity: 0; } to { opacity: 1; } }
        .fadeIn { animation-name: fadeIn; }

        @keyframes fadeInBottom {
            0% { opacity: 0; transform: translate3d(0, 100%, 0); }
            to { opacity: 1; transform: translateZ(0); }
        }
        .fadeInBottom { animation-name: fadeInBottom; }

        @keyframes fadeInTop {
            0% { opacity: 0; transform: translate3d(0, -100%, 0); }
            to { opacity: 1; transform: translateZ(0); }
        }
        .fadeInTop { animation-name: fadeInTop; }

        /* ============================================
           SKYFALL CUBES - GOLDEN FRIEZA
        ============================================ */
        .skyfall-container {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .cube-wrap {
            position: absolute;
            top: -100px;
            animation-name: fall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform;
        }

        @keyframes fall {
            0%   { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(0, calc(100vh + 200px), 0); }
        }

        .cube {
            display: block;
            animation-name: rotate;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            background: linear-gradient(135deg, #ff4d8d 0%, #ff176f 35%, #8f123f 70%, #8B6914 100%);
            border: 1.5px solid rgba(123, 47, 190, 0.9);
            border-radius: 2px;
            box-shadow:
                0 0 18px rgba(255, 46, 120, 0.85),
                0 0 36px rgba(255, 200, 0, 0.5),
                0 0 60px rgba(123, 47, 190, 0.4),
                inset 2px 2px 0 rgba(255, 255, 220, 0.6),
                inset -2px -2px 0 rgba(80, 50, 0, 0.4);
            position: relative;
            will-change: transform;
        }

        .cube::before, .cube::after {
            content: '';
            position: absolute;
            background: rgba(200, 150, 255, 0.55);
            border-radius: 50%;
        }
        .cube::before { width: 15%; height: 15%; top: 25%; left: 20%; }
        .cube::after  { width: 10%; height: 10%; top: 55%; right: 25%; }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .cube-s  { width: 16px; height: 16px; animation-duration: 3s; }
        .cube-m  { width: 26px; height: 26px; animation-duration: 4s; }
        .cube-l  { width: 38px; height: 38px; animation-duration: 5s; }
        .cube-xl { width: 48px; height: 48px; animation-duration: 6s; }

        .c1  { left: 2%;  animation-duration: 7s;  animation-delay: 0s; }
        .c2  { left: 7%;  animation-duration: 9s;  animation-delay: 1.2s; }
        .c3  { left: 12%; animation-duration: 6s;  animation-delay: 2.5s; }
        .c4  { left: 17%; animation-duration: 10s; animation-delay: 0.8s; }
        .c5  { left: 22%; animation-duration: 8s;  animation-delay: 3.1s; }
        .c6  { left: 27%; animation-duration: 11s; animation-delay: 1.7s; }
        .c7  { left: 32%; animation-duration: 7s;  animation-delay: 4.2s; }
        .c8  { left: 37%; animation-duration: 9s;  animation-delay: 2.0s; }
        .c9  { left: 42%; animation-duration: 6s;  animation-delay: 5.5s; }
        .c10 { left: 47%; animation-duration: 10s; animation-delay: 0.5s; }
        .c11 { left: 52%; animation-duration: 8s;  animation-delay: 3.8s; }
        .c12 { left: 57%; animation-duration: 12s; animation-delay: 1.5s; }
        .c13 { left: 62%; animation-duration: 7s;  animation-delay: 4.8s; }
        .c14 { left: 67%; animation-duration: 9s;  animation-delay: 2.3s; }
        .c15 { left: 72%; animation-duration: 6s;  animation-delay: 0.9s; }
        .c16 { left: 77%; animation-duration: 11s; animation-delay: 5.2s; }
        .c17 { left: 82%; animation-duration: 8s;  animation-delay: 1.8s; }
        .c18 { left: 87%; animation-duration: 10s; animation-delay: 3.6s; }
        .c19 { left: 92%; animation-duration: 7s;  animation-delay: 2.7s; }
        .c20 { left: 97%; animation-duration: 9s;  animation-delay: 4.5s; }

        @media (max-width: 768px) {
            .cube-wrap:nth-child(n+14) { display: none; }
